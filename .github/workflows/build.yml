name: Build vmlinux

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: DiskDVD/android_kernel_common_realme_sm6650
          ref: main

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex \
            libssl-dev libelf-dev libncurses-dev \
            dwarves python3 git clang llvm lld \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            cpio rsync

      - name: Configure
        run: |
          make O=out ARCH=arm64 gki_defconfig

      - name: Build vmlinux
        run: |
          make O=out -j"$(nproc)" \
            ARCH=arm64 \
            LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            vmlinux

      - name: Upload vmlinux
        uses: actions/upload-artifact@v4
        with:
          name: vmlinux-main-arm64
          path: out/vmlinux
          if-no-files-found: error
          retention-days: 14

      - name: Upload config
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-config
          path: out/.config
          if-no-files-found: ignore
          retention-days: 14
