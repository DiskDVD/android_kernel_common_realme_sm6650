name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Kernel
        uses: xiaoleGun/KernelSU_Action@main
        with:
          kernel_url: https://github.com/DiskDVD/android_kernel_common_realme_sm6650
          kernel_branch: main
          config: gki_defconfig
          arch: arm64
          clang_version: r487747c
          ksu: false
          release: true
