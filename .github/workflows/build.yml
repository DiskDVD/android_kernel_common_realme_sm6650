name: Build Kernel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Build kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/DiskDVD/android_kernel_common_realme_sm6650
          kernel-branch: main
          config: gki_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: false
          other-clang-url: https://github.com/kdrag0n/proton-clang
          other-clang-branch: master
          disable-lto: true
          anykernel3: false
          release: true
          access-token: ${{ secrets.GITHUB_TOKEN }}
