name: Build vmlinux

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential flex gawk git make pahole python3 rsync \
            cpio file clang llvm lld \
            libelf-dev libncurses-dev libssl-dev zlib1g-dev \
            liblz4-tool libzstd-dev

      - name: Configure kernel
        run: |
          make O=out ARCH=arm64 LLVM=1 gki_defconfig

      - name: Enable debug info
        run: |
          scripts/config --file out/.config \
            -e DEBUG_INFO \
            -e DEBUG_INFO_DWARF4 \
            -d DEBUG_INFO_DWARF5
          make O=out ARCH=arm64 LLVM=1 olddefconfig

      - name: Build vmlinux
        run: |
          make O=out ARCH=arm64 LLVM=1 -j"$(nproc)" vmlinux
          test -s out/vmlinux

      - name: Verify
        run: |
          file out/vmlinux
          ls -lh out/vmlinux out/System.map

      - name: Upload vmlinux
        uses: actions/upload-artifact@v4
        with:
          name: vmlinux-main
          path: |
            out/vmlinux
            out/System.map
            out/.config
          if-no-files-found: error
          retention-days: 14
